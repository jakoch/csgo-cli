# -----------------------------------------------------------------------------
# This workflow builds the csgo-cli util on Windows.
# -----------------------------------------------------------------------------
name: "Build on Windows"

on:
  - push
  - pull_request
  # You can manually run this workflow.
  - workflow_dispatch

# improve CI concurrency by automatically cancelling outdated jobs
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:

# ---------------------------------------------------------------------------------------

  build-on-windows:

# ---------------------------------------------------------------------------------------

    name: "${{ matrix.config.job_name }}"

    # https://github.com/actions/runner-images
    runs-on: windows-2025

    strategy:
      fail-fast: false
      matrix:
        config:
        # https://github.com/actions/runner-images/blob/main/images/windows/Windows2025-Readme.md#visual-studio-enterprise-2026
        - {
            job_name: "Windows VC18 Release",
            preset: vc18-x64-windows-static-rel,
            build_type: Release,
            artifact-name: csgo-cli-vc18-x64-windows-static-rel
          }
        - {
            job_name: "Windows VC18 RelWithDebInfo",
            preset: vc18-x64-windows-static-rdi,
            build_type: RelWithDebInfo,
            artifact-name: csgo-cli-vc18-x64-windows-static-rdi
          }
        - {
            job_name: "Windows VC18 Debug",
            preset: vc18-x64-windows-static-dbg,
            build_type: Debug,
            artifact-name: csgo-cli-vc18-x64-windows-static-dbg
          }

    env:
      # VCPKG Settings
      VCPKG_DISABLE_METRICS: 1
      VCPKG_FORCE_SYSTEM_BINARIES: 1
      VCPKG_FEATURE_FLAGS: manifests,versions,binarycaching,registries
      VCPKG_INSTALLATION_ROOT: 'C:\vcpkg'
      # Paths
      BUILD_DIR: ${{ github.workspace }}\out\build\${{ matrix.config.preset }}
      INSTALL_DIR: ${{ github.workspace }}\out\install\${{ matrix.config.preset }}

    defaults:
      run:
        shell: cmd

    steps:
      - name: 🤘 Checkout Code
        uses: actions/checkout@v7 # https://github.com/actions/checkout

      # https://community.chocolatey.org/packages/ccache
      #- name: 🔽 Install ccache
      #  run: choco install ccache --no-progress

      # https://community.chocolatey.org/packages/ninja
      - name: 🔽 Install Ninja
        run: choco install ninja --no-progress

      # https://community.chocolatey.org/packages/cmake
      - name: 🔽 Install CMake
        run: choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' --no-progress

      # https://github.com/actions/runner-images/blob/main/images/windows/Windows2025-Readme.md#visual-studio-enterprise-2026
      # Note: yes, the windows-2025 image contains "Studio\2026\Enterprise".
      - name: 📥 Setup VC18 Environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: 🔽 Update VCPKG
        run: |
          cd ${{ env.VCPKG_INSTALLATION_ROOT }}
          git reset --hard
          git pull --quiet
          bootstrap-vcpkg.bat -disableMetrics
          vcpkg integrate install --triplet=x64-windows-static --feature-flags=manifests
          vcpkg version

      - name: 🎯 Cache VCPKG
        if: always()
        id: cache-vcpkg
        uses: actions/cache@v6 # https://github.com/actions/cache
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: cache-windows-vcpkg-x64-windows-static-${{ matrix.config.preset }}-${{ github.ref }}-${{ github.run_number }}
          restore-keys: |
            cache-windows-vcpkg-x64-windows-static-${{ matrix.config.preset }}-${{ github.ref }}
            cache-windows-vcpkg-x64-windows-static-${{ matrix.config.preset }}
            cache-windows-vcpkg-x64-windows-static

      - name: Extract SW_SDK
        env:
          SW_SDK_SECRET: ${{ secrets.SW_SDK_SECRET }}
        run: |
          dir
          7z x ${{ github.workspace }}\downloads\sw_sdk_165.zip -aoa -y -odependencies -p%SW_SDK_SECRET%
          cd dependencies
          ren sdk sw_sdk

      - name: Fix encoding of SW_SDK headers
        run: |
          Get-ChildItem dependencies\sw_sdk\*.h -Recurse | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            Set-Content -Path $_.FullName -Value $content -Encoding utf8
          }
        shell: powershell

      - name: ✏ CMake ➔ Configure (including VCPKG → Install Dependencies)
        run: |
          cmake --preset ${{ matrix.config.preset }}

      - name: ❔ CHECK important folders, to see if everything is present (before building)
        run: |
          dir ${{ github.workspace }}
          dir ${{ github.workspace }}\downloads
          dir ${{ github.workspace }}\dependencies

      - name: 🙏 CMake → Build
        run: cmake --build ${{ env.BUILD_DIR }} -j %NUMBER_OF_PROCESSORS%

      - name: ✔ ❌✔️ Test → Run CTest → Generate test_results.xml
        run: |
          cd ${{ env.BUILD_DIR }}\tests
          ctest -V --output-junit test_results_x64-windows-static_${{ matrix.config.preset }}.xml

      - name: 📦 CMake ➔ Install
        run: cmake --install ${{ env.BUILD_DIR }} --prefix ${{ env.INSTALL_DIR }} --verbose

      - name: ❔ CHECK important folders, to see if everything is present (after building & installing)
        run: |
          dir /S /B ${{ env.BUILD_DIR }}
          dir /S /B ${{ env.INSTALL_DIR }}

      - name: 🔼 Upload Test Results
        uses: actions/upload-artifact@v7 # https://github.com/actions/upload-artifact
        if: always()
        with:
          name: test-results-${{ matrix.config.preset }}
          path: ${{ env.BUILD_DIR }}\tests\test_results_*.xml

      - name: 🔼 Upload Build Artifact -> csgo_cli
        uses: actions/upload-artifact@v7 # https://github.com/actions/upload-artifact
        with:
          name: csgo_cli-x64-windows-static-${{ matrix.config.preset }}
          path: ${{ env.INSTALL_DIR }}\bin\

# ---------------------------------------------------------------------------------------

  publish-test-results:

# ---------------------------------------------------------------------------------------

    # Only publish test results, when the action runs in your repository's context.
    # In other words: this disables publishing tests results from pull requests.
    # PR test results are published from the standalone workflow "publish-PR-test-results.yml".

    name: "Publish Tests Results"
    needs: build-on-windows
    runs-on: ubuntu-latest
    if: always() && ( github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository )

    steps:

      - name: 🔽 Download Artifacts
        uses: actions/download-artifact@v8 # https://github.com/actions/download-artifact
        with:
          path: artifacts

      - name: 👌 Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2 # https://github.com/EnricoMi/publish-unit-test-result-action
        if: always()
        with:
          files: artifacts/**/test_results*.xml
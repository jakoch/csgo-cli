name: Build on Linux

on:
  - push
  - pull_request
  # You can manually run this workflow.
  - workflow_dispatch

# improve CI concurrency by automatically cancelling outdated jobs
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:

# ---------------------------------------------------------------------------------------

  build-on-linux:

# ---------------------------------------------------------------------------------------

    name: "${{ matrix.config.job_name }}"

    # https://github.com/actions/runner-images#available-environments
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
        # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2604-Readme.md
        - {
            job_name: "Linux | Clang 22 | Release",
            os: ubuntu-26.04,
            preset: clang22-x64-linux-rel,
            triplet: x64-linux,
            artifact-name: csgo-cli-clang22-x64-linux
          }
        - {
            job_name: "Linux | GCC 15 | Release",
            os: ubuntu-26.04,
            preset: gcc15-x64-linux-rel,
            triplet: x64-linux,
            artifact-name: csgo-cli-gcc15-x64-linux
          }

    env:
      # VCPKG Settings
      VCPKG_DISABLE_METRICS: 1
      VCPKG_FORCE_SYSTEM_BINARIES: 1
      VCPKG_FEATURE_FLAGS: manifests,versions,binarycaching,registries
      VCPKG_ROOT: /usr/local/share/vcpkg
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
      # Paths
      SOURCE_DIR:  ${{ github.workspace }}
      BUILD_DIR:   ${{ github.workspace }}/out/build/${{ matrix.config.preset }}
      INSTALL_DIR: ${{ github.workspace }}/out/install/${{ matrix.config.preset }}
      # Path to non-vcpkg dependencies
      DEPS_DIR:    ${{ github.workspace }}/dependencies

    defaults:
      run:
        shell: bash

    steps:
      - name: 🤘 Checkout Code
        uses: actions/checkout@v7 # https://github.com/actions/checkout

      - name: 🔽 Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            software-properties-common \
            ninja-build \
            cmake \
            jq \
            wget \
            git \
            pkg-config

      - name: Get latest CMake and Ninja
        uses: lukka/get-cmake@latest # https://github.com/lukka/get-cmake
        with:
          cmakeVersion: latest
          ninjaVersion: latest

      - name: ℹ Show Tool Versions
        run: |
          cmake --version
          ninja --version

      - name: 🎯 Setup VCPKG Cache
        id: cache-vcpkg
        uses: actions/cache@v6 # https://github.com/actions/cache
        with:
          # https://github.com/microsoft/vcpkg/blob/master/docs/users/binarycaching.md#configuration
          path: |
            ${{ env.VCPKG_INSTALLED_DIR }}
            ${{ env.VCPKG_ROOT }}/packages
            ~/.cache/vcpkg/archives
          key: cache-vcpkg-${{ matrix.config.preset }}-${{ github.ref }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            cache-vcpkg-${{ matrix.config.preset }}-${{ github.ref }}
            cache-vcpkg-${{ matrix.config.preset }}

      - name: 🔽 1.1 Update VCPKG (latest TAG)
        run: |
          cd ${{ env.VCPKG_ROOT }}
          git fetch origin --tags --force
          git checkout master
          git reset --hard origin/master
          git clean -fdx
          LATEST_VCPKG_TAG="$(git tag --sort=-v:refname | head -n 1)"
          git checkout "$LATEST_VCPKG_TAG"

      - name: 🛠️ 1.2 Setup VCPKG
        run: |
          "${VCPKG_ROOT}/bootstrap-vcpkg.sh"
          "${VCPKG_ROOT}/vcpkg" integrate install

      - name: 📦 1.3 Install VCPKG dependencies
        run: |
          "${{ env.VCPKG_ROOT }}/vcpkg" install --triplet "${{ matrix.config.triplet }}" --x-install-root="${{ env.VCPKG_INSTALLED_DIR }}"

      - name: ❔ CHECK important folders, to see if everything is present (after vcpkg install)
        run: |
          ls -lahr "${{ env.VCPKG_ROOT }}" || true
          ls -lahr "${{ env.VCPKG_INSTALLED_DIR }}/${{ matrix.config.triplet }}/" || true
          ls -lahr "${{ env.VCPKG_INSTALLED_DIR }}/${{ matrix.config.triplet }}/include" || true

      - name: Extract SW_SDK
        env:
          SW_SDK_SECRET: ${{ secrets.SW_SDK_SECRET }}
        run: |
          7z x ${{ github.workspace }}/downloads/sw_sdk_165.zip -aoa -y -odependencies -p"${SW_SDK_SECRET}"
          cd dependencies
          mv sdk sw_sdk

      - name: Fix encoding of SW_SDK headers
        run: |
          find dependencies/sw_sdk -name "*.h" -print0 | xargs -0 -I{} sh -c '
            tmp=$(mktemp)
            iconv -f CP1252 -t UTF-8 "{}" > "$tmp" && mv "$tmp" "{}"
          '

      - name: 🛠️ 2.1 Configure csgo-cli
        run: |
          cmake \
            --preset ${{ matrix.config.preset }} \
            -B ${{ env.BUILD_DIR }} \
            -DCMAKE_PREFIX_PATH="${{ env.VCPKG_INSTALLED_DIR }}/${{ matrix.config.triplet }}" \
            -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.config.triplet }} \
            -DVCPKG_INSTALLED_DIR=${{ env.VCPKG_INSTALLED_DIR }}

      - name: 🙏 2.2 Build csgo-cli
        run: cmake --build ${{ env.BUILD_DIR }}

      - name: 📦 2.3 Install csgo-cli
        run: |
          cmake --install ${{ env.BUILD_DIR }} \
                --prefix ${{ env.INSTALL_DIR }} \
                --verbose

      - name: 🧪 CTest ➔ Run Tests
        run: |
          ctest \
            --test-dir "${{ env.BUILD_DIR }}" \
            --output-on-failure

      - name: ❔ CHECK important folders, to see if everything is present (after building)
        run: |
          ls -lahr ${{ env.BUILD_DIR }}
          ls -lahr ${{ env.INSTALL_DIR }}

      - name: 🔼 Upload Build Artifact -> csgo_cli
        uses: actions/upload-artifact@v7 # https://github.com/actions/upload-artifact
        with:
          name: csgo-cli-${{ matrix.config.triplet }}-${{ matrix.config.preset }}
          path: ${{ env.INSTALL_DIR }}/bin/
          retention-days: 30

# ---------------------------------------------------------------------------------------

  build-on-container:

# ---------------------------------------------------------------------------------------

    name: ${{ matrix.config.job_name }}

    runs-on: ubuntu-latest
    container: ghcr.io/jakoch/cpp-devbox:${{ matrix.config.image_version }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {
              job_name: "Linux | GCC 16 | Release",
              image_version: "trixie-20260726",
              preset: "gcc16-x64-linux-rel",
              triplet: x64-linux,
              artifact-name: "csgo-cli-gcc16-x64-linux"
            }
          - {
              job_name: "Linux | Clang 22 | Release",
              image_version: "trixie-20260726",
              preset: "clang22-x64-linux-rel",
              triplet: x64-linux,
              artifact-name: "csgo-cli-clang22-x64-linux"
            }
          - {
              job_name: "Linux | Clang 22 | Debug",
              image_version: "trixie-20260726",
              preset: "clang22-x64-linux-dbg",
              triplet: x64-linux,
              artifact-name: "csgo-cli-clang22-x64-linux-dbg"
            }
          - {
              job_name: "Linux | Clang 22 | Coverage",
              image_version: "trixie-20260726",
              preset: "clang22-x64-linux-dbg-cov",
              triplet: x64-linux,
              artifact-name: "csgo-cli-clang22-x64-linux-cov"
            }

    permissions:
      id-token: write

    env:
      # VCPKG Settings
      VCPKG_DISABLE_METRICS: 1
      VCPKG_FORCE_SYSTEM_BINARIES: 1
      VCPKG_FEATURE_FLAGS: manifests,versions,binarycaching,registries
      # vcpkg is pre-installed at /opt/vcpkg in the devcontainer images.
      VCPKG_ROOT: /opt/vcpkg

    defaults:
      run:
        shell: bash

    steps:
      - name: 🤘 Checkout Code
        uses: actions/checkout@v7 # https://github.com/actions/checkout

      # NOTE: In a container job, ${{ github.workspace }} resolves to the host path
      # (/home/runner/work/...), which does NOT exist inside the container.
      # The workspace is mounted at $GITHUB_WORKSPACE (e.g. /__w/...). Derive all
      # paths from $GITHUB_WORKSPACE so they are valid inside the container.
      - name: 📂 Setup Workspace Paths
        run: |
          echo "SOURCE_DIR=${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"
          echo "BUILD_DIR=${GITHUB_WORKSPACE}/out/build/${{ matrix.config.preset }}" >> "$GITHUB_ENV"
          echo "INSTALL_DIR=${GITHUB_WORKSPACE}/out/install/${{ matrix.config.preset }}" >> "$GITHUB_ENV"
          echo "DEPS_DIR=${GITHUB_WORKSPACE}/dependencies" >> "$GITHUB_ENV"
          echo "VCPKG_INSTALLED_DIR=${GITHUB_WORKSPACE}/vcpkg_installed" >> "$GITHUB_ENV"

      - name: ℹ Show Tool Versions
        run: |
          cmake --version
          ninja --version

      - name: 🔽 Install required system packages (for vcpkg packages)
        run: |
          sudo apt-get update
          sudo apt-get install -y 7zip

      - name: 🎯 Setup VCPKG Cache
        id: cache-vcpkg
        uses: actions/cache@v6 # https://github.com/actions/cache
        with:
          path: |
            ${{ env.VCPKG_INSTALLED_DIR }}
            ${{ env.VCPKG_ROOT }}/packages
            ~/.cache/vcpkg/archives
          key: cache-vcpkg-container-${{ matrix.config.preset }}-${{ github.ref }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            cache-vcpkg-container-${{ matrix.config.preset }}-${{ github.ref }}

      - name: 🔽 1.1 Update VCPKG (latest TAG)
        run: |
          cd ${{ env.VCPKG_ROOT }}
          git fetch origin --tags --force
          git checkout master
          git reset --hard origin/master
          git clean -fdx
          LATEST_VCPKG_TAG="$(git tag --sort=-v:refname | head -n 1)"
          git checkout "$LATEST_VCPKG_TAG"

      - name: 🛠️ 1.2 Setup VCPKG
        run: |
          "${VCPKG_ROOT}/bootstrap-vcpkg.sh"
          "${VCPKG_ROOT}/vcpkg" integrate install

      - name: 📦 1.3 Install VCPKG dependencies
        run: |
          "${{ env.VCPKG_ROOT }}/vcpkg" install --triplet "${{ matrix.config.triplet }}" --x-install-root="${{ env.VCPKG_INSTALLED_DIR }}"

      - name: ❔ CHECK important folders, to see if everything is present (after vcpkg install)
        run: |
          ls -lahr "${{ env.VCPKG_ROOT }}" || true
          ls -lahr "${{ env.VCPKG_INSTALLED_DIR }}/${{ matrix.config.triplet }}/" || true
          ls -lahr "${{ env.VCPKG_INSTALLED_DIR }}/${{ matrix.config.triplet }}/include" || true

      - name: Extract SW_SDK
        env:
          SW_SDK_SECRET: ${{ secrets.SW_SDK_SECRET }}
        run: |
          7z x ${GITHUB_WORKSPACE}/downloads/sw_sdk_165.zip -aoa -y -o${DEPS_DIR} -p"${SW_SDK_SECRET}"
          cd ${DEPS_DIR}
          mv sdk sw_sdk

      - name: Fix encoding of SW_SDK headers
        run: |
          find ${DEPS_DIR}/sw_sdk -name "*.h" -print0 | xargs -0 -I{} sh -c '
            tmp=$(mktemp)
            iconv -f CP1252 -t UTF-8 "{}" > "$tmp" && mv "$tmp" "{}"
          '

      - name: 🛠️ 2.1 Configure csgo-cli
        run: |
          cmake \
            --preset "${{ matrix.config.preset }}" \
            -B ${{ env.BUILD_DIR }} \
            -DCMAKE_PREFIX_PATH="${{ env.VCPKG_INSTALLED_DIR }}/${{ matrix.config.triplet }}" \
            -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.config.triplet }} \
            -DVCPKG_INSTALLED_DIR=${{ env.VCPKG_INSTALLED_DIR }}

      - name: 🙏 2.2 Build csgo-cli
        run: cmake --build ${{ env.BUILD_DIR }}

      - name: 📦 2.3 Install csgo-cli
        run: |
          cmake --install ${{ env.BUILD_DIR }} \
                --prefix ${{ env.INSTALL_DIR }} \
                --verbose

      - name: ⚙️ Prepare Coverage Environment
        if: ${{ matrix.config.preset == 'clang22-x64-linux-dbg-cov' }}
        run: |
          mkdir -p "${BUILD_DIR}/coverage"
          echo "LLVM_PROFILE_FILE=${BUILD_DIR}/coverage/%p.profraw" >> "$GITHUB_ENV"

      - name: 🧪 CTest ➔ Run Tests
        run: |
          ctest \
            --test-dir "${BUILD_DIR}" \
            --output-on-failure

      - name: ❔ CHECK folders, to see if everything is present (after building)
        run: |
          find "${{ env.INSTALL_DIR }}" -type f | sort

      - name: 🔍 clang-tidy
        if: matrix.config.preset == 'clang22-x64-linux-dbg-cov'
        run: |
          run-clang-tidy -p "${{ env.BUILD_DIR }}" \
            -quiet \
            2>&1 | tee clang-tidy-err.log \
            || true

      # ------------------------------------------------------------------------
      # Count Lines of Code (only for "clang22-x64-linux-dbg-cov" preset)
      # ------------------------------------------------------------------------

      - name: 🔽 Install scc
        if: ${{ matrix.config.preset == 'clang22-x64-linux-dbg-cov' }}
        run: |
          SCC_VERSION=v3.7.0
          curl -fL --retry 3 \
            -o scc.tar.gz \
            https://github.com/boyter/scc/releases/download/${SCC_VERSION}/scc_Linux_x86_64.tar.gz
          tar -xzf scc.tar.gz scc
          sudo mv scc /usr/local/bin/

      - name: 📊 Count LOC
        if: ${{ matrix.config.preset == 'clang22-x64-linux-dbg-cov' }}
        run: |
          scc . \
            --exclude-dir .git,build,out,vcpkg_installed \
            --no-cocomo --no-complexity --no-duplicates --no-size \
            --sort code \
            --format tabular

      # ------------------------------------------------------------------------
      # Code Coverage Steps (only for "clang22-x64-linux-dbg-cov" preset)
      # ------------------------------------------------------------------------

      - name: 🧾 Merge Coverage Data
        if: ${{ matrix.config.preset == 'clang22-x64-linux-dbg-cov' }}
        run: |
          set -euo pipefail
          echo "Merging .profraw files from ${{ env.BUILD_DIR }}/coverage"
          shopt -s nullglob
          profraw_files=("${{ env.BUILD_DIR }}/coverage"/*.profraw)
          if [ ${#profraw_files[@]} -eq 0 ]; then
            echo "::warning::No .profraw files found. Did tests run with LLVM_PROFILE_FILE set?"
            exit 0
          fi
          llvm-profdata merge -sparse "${profraw_files[@]}" -o "${{ env.BUILD_DIR }}/coverage/coverage.profdata"

      - name: 📊 Generate Coverage Reports (lcov + HTML)
        if: ${{ matrix.config.preset == 'clang22-x64-linux-dbg-cov' }}
        env:
          COV_EXCLUDE_REGEX: '(vcpkg_installed|build|tests)'
        run: |
          set -euo pipefail

          if [ ! -f "${{ env.BUILD_DIR }}/coverage/coverage.profdata" ]; then
            echo "::warning::No coverage.profdata found. Skipping llvm-cov."
            exit 0
          fi

          # Find all instrumented test binaries (ending with "_test" or "_tests") in the build directory.
          mapfile -t BINARIES < <(find "${{ env.BUILD_DIR }}" -maxdepth 3 -type f -executable \( -name "*_test" -o -name "*_tests" \) -print || true)
          if [ ${#BINARIES[@]} -eq 0 ]; then
            echo "::warning::No instrumented binaries found. Skipping llvm-cov."
            exit 0
          fi

          # Export LCOV report
          llvm-cov export -format=lcov -instr-profile="${{ env.BUILD_DIR }}/coverage/coverage.profdata" \
            "${BINARIES[@]}" --ignore-filename-regex="${COV_EXCLUDE_REGEX}" \
            > "${{ env.BUILD_DIR }}/coverage/coverage.lcov"

          # Generate HTML report
          #llvm-cov show -format=html -instr-profile="${{ env.BUILD_DIR }}/coverage/coverage.profdata" \
          # "${BINARIES[@]}" --ignore-filename-regex="${COV_EXCLUDE_REGEX}" \
          # -o "${{ env.BUILD_DIR }}/coverage/html" \

          # Print summary to CI logs for visibility
          llvm-cov report -instr-profile="${{ env.BUILD_DIR }}/coverage/coverage.profdata" \
            "${BINARIES[@]}" --ignore-filename-regex="${COV_EXCLUDE_REGEX}"

      - name: 🔼 Upload Coverage Artifact
        if: ${{ matrix.config.preset == 'clang22-x64-linux-dbg-cov' && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7 # https://github.com/actions/upload-artifact
        with:
          name: Coverage-Report-${{ matrix.config.preset }}
          path: ${{ env.BUILD_DIR }}/coverage/**

      - name: 📦 Upload Coverage to Codecov
        if: ${{ matrix.config.preset == 'clang22-x64-linux-dbg-cov' && github.event_name != 'pull_request' }}
        uses: codecov/codecov-action@v7 # https://github.com/codecov/codecov-action
        with:
          files: ${{ env.BUILD_DIR }}/coverage/coverage.lcov
          disable_search: true
          name: ${{ matrix.config.preset }}
          flags: ${{ matrix.config.preset }}
          use_oidc: true
          fail_ci_if_error: true

      - name: 🔼 Upload Build Artifact
        uses: actions/upload-artifact@v7 # https://github.com/actions/upload-artifact
        if: ${{ always() && matrix.config.preset != 'clang22-x64-linux-dbg-cov' && github.event_name != 'pull_request' }}
        with:
          name: ${{ matrix.config.artifact-name }}
          path: ${{ env.INSTALL_DIR }}/bin/
